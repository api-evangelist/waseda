      - url: https://www.waseda.jp/top/en/privacy-policy
        status: 200
        note: Official English privacy policy (the previously plausible /top/en/privacy is a 404).
      - url: https://www.waseda.jp/top/news/89507?lng=en
        status: 200
        note: Official institutional statement on generative AI use. Recorded as AIPolicy.
