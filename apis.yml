apis:
  - aid: waseda:iiif-presentation
    name: Waseda IIIF Presentation API (Cultural Resources)
    x-operator: institution
    description: >-
      Waseda University operates its own IIIF server for the Kotenseki Sogo Database (古典籍総合データベース)
      of classical Japanese books and the Waseda Cultural Resources Database (文化資源データベース). It serves
      IIIF Presentation API 2.1 manifests as application/json — sc:Manifest documents carrying label,
      metadata, attribution "早稲田大学図書館 (Waseda University Library)", a license pointer to Waseda's own
      image-use terms, and a sequence of sc:Canvas each wired to the Image API service. Anonymous, no
      credential, no rate-limit signal advertised. This is the clearest piece of Waseda-authored
      machine-readable infrastructure in the profile.
    humanURL: https://www.wul.waseda.ac.jp/kotenseki/ga_IIIF/about_iiif.html
    baseURL: https://iiif.archive.waseda.jp/iiif/manifest
    tags: [ IIIF, Cultural Heritage, Digital Archives, Library, Metadata, JSON-LD ]
    properties:
      - type: Documentation
        url: https://www.wul.waseda.ac.jp/kotenseki/ga_IIIF/about_iiif.html
      - type: Specification
        url: https://iiif.io/api/presentation/2.1/
      - type: TermsOfService
        url: https://www.waseda.jp/library/user/using-images/
      - type: Examples
        url: examples/waseda-examples.yml
  - aid: waseda:iiif-image
    name: Waseda IIIF Image API
    x-operator: institution
    description: >-
      The image-tile half of the same Waseda-operated IIIF deployment. info.json declares protocol
      http://iiif.io/api/image at Image API 2.0 compliance level 1, 256x256 tiles with scale factors
      to 512, five precomputed sizes, jpg format and native/color/gray qualities. Requests follow the
      standard IIIF path template
      /iiif/image/{collection}/{item}/{image}/{region}/{size}/{rotation}/{quality}.{format}. Served
      as application/ld+json, anonymous.
    humanURL: https://www.wul.waseda.ac.jp/kotenseki/ga_IIIF/about_iiif.html
    baseURL: https://iiif.archive.waseda.jp/iiif/image
    tags: [ IIIF, Images, Cultural Heritage, Digital Archives, JSON-LD ]
    properties:
      - type: Documentation
        url: https://www.wul.waseda.ac.jp/kotenseki/ga_IIIF/about_iiif.html
      - type: Specification
        url: https://iiif.io/api/image/2.0/
      - type: Examples
        url: examples/waseda-examples.yml
  - aid: waseda:shibboleth-idp
    name: Waseda Identity Provider (Shibboleth SAML 2.0)
    x-operator: institution
    description: >-
      Waseda operates its own Shibboleth SAML 2.0 identity provider. The metadata document is served
      anonymously as application/xml and declares entityID https://iaidp.ia.waseda.jp/idp/shibboleth,
      shibmd:Scope waseda.jp, SAML2 Redirect / POST / POST-SimpleSign SSO and SLO endpoints, and
      SAML1/SAML2 SOAP ArtifactResolution and AttributeQuery on port 8443. This is machine-readable
      institution-operated identity infrastructure, not a public API — a relying party reaches it by
      registering a Service Provider in the federation, not by obtaining a key.
    humanURL: https://support.waseda.jp/it/s/
    baseURL: https://iaidp.ia.waseda.jp/idp/shibboleth
    tags: [ Identity, SSO, Shibboleth, SAML, Authentication, Federation ]
    properties:
      - type: Documentation
        url: https://support.waseda.jp/it/s/
      - type: Authentication
        url: authentication/waseda-authentication.yml
      - type: Conformance
        url: conformance/waseda-conformance.yml
  - aid: waseda:gakunin-federation
    name: GakuNin Academic Access Federation membership
    x-operator: federation
    description: >-
      Waseda's identity provider is registered in GakuNin (学術認証フェデレーション), the Japanese academic
      identity federation operated by the National Institute of Informatics, and reaches eduGAIN
      through it. The entityID https://iaidp.ia.waseda.jp/idp/shibboleth was confirmed present in the
      GakuNin operational metadata aggregate on 2026-09-01, carrying OrganizationDisplayName
      "Waseda University". A federation is shared by definition and the aggregate is NII's; the IdP
      inside it is Waseda's. Recorded as a membership, never as a Waseda contract.
    humanURL: https://www.gakunin.jp/participants
    baseURL: https://metadata.gakunin.nii.ac.jp/gakunin-metadata.xml
    tags: [ Identity Federation, GakuNin, eduGAIN, SAML, Shibboleth, NII ]
    properties:
      - type: Documentation
        url: https://www.gakunin.jp/
      - type: Conformance
        url: conformance/waseda-conformance.yml
  - aid: waseda:moodle-lti
    name: Waseda Moodle — LTI 1.3 / LTI Advantage platform
    x-operator: institution
    description: >-
      Waseda Moodle runs on Waseda's own host and is a live LTI 1.3 learning-tools-interoperability
      platform. It publishes a JWKS keyset anonymously (one RSA/RS256 key, kid ea841dc4e7af7463cc4c),
      an OIDC third-party-initiated login endpoint, an OAuth 2.0 client-credentials token endpoint
      that returns a correctly shaped invalid_request error to an empty call, and an LTI Advantage
      services endpoint that rejects GET with a structured 405. Tool registration is administrative;
      there is no self-service developer path. The LTI implementation is Moodle's engineering — what
      is Waseda's is the deployment, the host and the signing key.
    humanURL: https://wsdmoodle.waseda.jp/
    baseURL: https://wsdmoodle.waseda.jp/mod/lti
    tags: [ LTI, Learning Management, Moodle, OAuth2, JWKS, Education Technology ]
    properties:
      - type: Authentication
        url: authentication/waseda-authentication.yml
      - type: Conformance
        url: conformance/waseda-conformance.yml
      - type: Specification
        url: https://www.imsglobal.org/spec/lti/v1p3
      - type: Examples
        url: examples/waseda-examples.yml
  - aid: waseda:moodle-webservices
    name: Waseda Moodle Web Services (REST)
    x-operator: institution
    description: >-
      The Moodle Web Services REST endpoint is deployed on Waseda's own host and answers an anonymous
      call with Moodle's structured invalidtoken fault. Access requires a per-user token issued by a
      Waseda Moodle administrator; there is no public issuance path and no published function list.
      Note that the endpoint returns HTTP 200 with the fault in the body, so a status-code-only check
      will misread it as an open API.
    humanURL: https://wsdmoodle.waseda.jp/
    baseURL: https://wsdmoodle.waseda.jp/webservice/rest/server.php
    tags: [ Moodle, Learning Management, REST, Education Technology ]
    properties:
      - type: Authentication
        url: authentication/waseda-authentication.yml
      - type: Examples
        url: examples/waseda-examples.yml
  - aid: waseda:repository-oai
    name: Waseda University Repository (OAI-PMH)
    x-operator: tenant
    description: >-
      OAI-PMH 2.0 metadata harvesting for the Waseda University Repository. The collection, the
      administrative contact (repository@list.waseda.jp) and the identity are Waseda's; the host and
      the WEKO3 software are NII's JAIRO Cloud, so the operator is tenant and no contract is saved
      under Waseda's name. Identify confirms protocolVersion 2.0, earliestDatestamp 2016-07-05,
      deletedRecord transient, granularity to the second. Seven metadata formats are served —
      jpcoar_2.0, jpcoar_1.0, jpcoar, jpcoar_v1, oai_dc, ddi and lom — a configured JPCOAR deployment.
      The endpoint answers a plain client with 200 and a desktop-browser User-Agent with 406; that is
      a content-negotiation quirk on NII's nginx, not an outage.
    humanURL: https://waseda.repo.nii.ac.jp/
    baseURL: https://waseda.repo.nii.ac.jp/oai
    tags: [ Repository, OAI-PMH, Open Access, Research, Metadata, JPCOAR ]
    properties:
      - type: Documentation
        url: https://www.openarchives.org/OAI/openarchivesprotocol.html
      - type: Conformance
        url: conformance/waseda-conformance.yml
      - type: Examples
        url: examples/waseda-examples.yml
  - aid: waseda:wine-primo
    name: WINE Library Discovery (Ex Libris Primo tenancy)
    x-operator: tenant
    description: >-
      Waseda University Library's discovery service, WINE, is an Ex Libris Primo VE tenancy under
      institution code 81SOKEI_WUNI. The discovery UI is live and is Waseda's service, but it is Ex
      Libris's engineering and Ex Libris's contract. The Primo Search REST and Alma SRU interfaces
      that exist as platform capabilities are not enabled for public use here: SRU explain requests
      against both plausible institution codes return 404 SERVICE_NOT_FOUND. Recorded as a tenancy
      relationship only; no Ex Libris contract is saved under Waseda.
    humanURL: https://waseda.primo.exlibrisgroup.com/discovery/search?vid=81SOKEI_WUNI:WINE
    tags: [ Library, Discovery, Primo, Alma, Ex Libris ]
    tags_raw:
      - Library
      - Discovery
      - Primo
      - Alma
      - ExLibris
    properties:
      - type: Documentation
        url: https://waseda-jp.libguides.com/winehelp_en
      - type: Authentication
        url: authentication/waseda-authentication.yml
  - aid: waseda:ror-registration
    name: ROR registration (Research Organization Registry)
    x-operator: registry
    description: >-
      Waseda University is registered in the Research Organization Registry as
      https://ror.org/00ntfnx83 — established 1882, types education and funder, with external
      identifiers GRID grid.5290.e, ISNI 0000 0004 1936 9975, Wikidata Q274486 and Crossref Funder ID
      501100004423. A registry membership is a fact about the institution, machine-readable through
      the registry's own API. The registry's contract belongs to ROR, not to Waseda.
    humanURL: https://ror.org/00ntfnx83
    baseURL: https://api.ror.org/v2/organizations/00ntfnx83
    tags: [ Registry, ROR, Persistent Identifiers, Research ]
    properties:
      - type: Examples
        url: examples/waseda-examples.yml
  - aid: waseda:crossref-funder
    name: Crossref Open Funder Registry membership
    x-operator: registry
    description: >-
      Waseda University holds Crossref Open Funder Registry ID 501100004423, located in Japan, with
      1,458 works attributed and two descendant funder identifiers (501100006539, 501100018983).
      Waseda is in the Funder Registry only — a Crossref members query for "waseda" returns zero
      results, so Waseda is not a Crossref DOI-depositing member. Both facts are recorded so neither
      is over-read.
    humanURL: https://www.crossref.org/services/funder-registry/
    baseURL: https://api.crossref.org/funders/501100004423
    tags: [ Registry, Crossref, Funder Registry, Persistent Identifiers, Research ]
    properties:
      - type: Examples
        url: examples/waseda-examples.yml
