aid: waseda
name: Waseda University
x-type: university
x-category: Private Research University
description: >-
  Waseda University is a large private research university in Shinjuku, Tokyo, founded in 1882 and one
  of Japan's two best-known private institutions. It operates no developer portal, publishes no
  OpenAPI, and has no official GitHub organization — but it is not the empty profile that description
  usually implies, because three genuinely institution-operated machine-readable surfaces sit under
  its own domains and answer anonymous calls. Waseda runs its own IIIF server at
  iiif.archive.waseda.jp, serving IIIF Presentation 2.1 manifests and IIIF Image API 2.0 level-1
  endpoints for the Kotenseki Sogo Database of classical Japanese books and the Waseda Cultural
  Resources Database — a real, callable cultural-heritage API on Waseda's engineering. It runs its own
  Shibboleth SAML 2.0 identity provider at iaidp.ia.waseda.jp, whose entityID is registered in the
  GakuNin federation operated by NII and propagated onward to eduGAIN. And Waseda Moodle at
  wsdmoodle.waseda.jp is a live LTI 1.3 / LTI Advantage platform publishing a JWKS keyset, an OAuth 2.0
  client-credentials token endpoint and an LTI services endpoint, alongside a token-gated Moodle Web
  Services REST endpoint. Its other apparent APIs are not its own: the Waseda University Repository's
  OAI-PMH 2.0 endpoint is real and its content is Waseda's, but it runs on NII's JAIRO Cloud, and the
  WINE library discovery service is an Ex Libris Primo tenancy whose Primo and Alma SRU interfaces are
  not enabled for public use. Waseda is registered in ROR (00ntfnx83) and holds Crossref Open Funder
  Registry ID 501100004423, but is not a Crossref depositing member and holds no DataCite account.
