  reason: covered
  detail: >-
    Waseda was fully reachable and the re-profile found more institution-operated surface than the
    June 2026 pass did, not less. Three Waseda-operated machine-readable surfaces were verified by
    anonymous probe: the IIIF Image and Presentation servers at iiif.archive.waseda.jp (200,
    application/ld+json and application/json), the Shibboleth SAML 2.0 IdP metadata at
    iaidp.ia.waseda.jp (200, application/xml, entityID confirmed present in the GakuNin federation
    aggregate), and the Waseda Moodle LTI 1.3 platform at wsdmoodle.waseda.jp (JWKS 200, token
    endpoint 400 invalid_request, services endpoint 405, Web Services REST 200 with an invalidtoken
    fault body). The IIIF surface and the LTI platform are both new to this profile. Two vendor
    tenancies are recorded as relationships with x-operator tenant and no vendor contract was saved
    under Waseda's name: the repository OAI-PMH endpoint on NII's JAIRO Cloud and the WINE discovery
    service on Ex Libris Primo, whose Alma SRU is not enabled (404 SERVICE_NOT_FOUND on both plausible
    institution codes). Two registry memberships are recorded and evidenced, ROR and the Crossref Open
    Funder Registry; DataCite returned meta.total 0 and is recorded as absent rather than assumed.
    Two limits are worth stating. www.waseda.jp answers /robots.txt, /llms.txt and
    /.well-known/security.txt with a 403 WAF page rather than a 404, so those are unreadable rather
    than confirmed absent. And Waseda has no official GitHub organization — github.com/wasedatime is
    an unaffiliated student project whose backend api.wasedatime.com returns 403 with no public
    documentation and no evidence of institutional endorsement, so it is not credited here and the
    stale GitHub pointer that claimed it was removed.
