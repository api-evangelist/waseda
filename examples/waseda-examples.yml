  - id: lti-token-error
    surface: Waseda Moodle — LTI Advantage token endpoint
    operator: institution
    request:
      method: GET
      url: https://wsdmoodle.waseda.jp/mod/lti/token.php
    response:
      status: 400
      excerpt: '{ "error" : "invalid_request" }'

  - id: lti-services-error
    surface: Waseda Moodle — LTI Advantage services
    operator: institution
    request:
      method: GET
      url: https://wsdmoodle.waseda.jp/mod/lti/services.php
    response:
      status: 405
      content_type: application/json
      excerpt: |
        { "status": 405, "reason": "Method Not Allowed",
          "request": { "method": "GET", "url": "/mod/lti/services.php", "accept": "*/*" } }

  - id: moodle-webservice-invalidtoken
    surface: Waseda Moodle — Web Services REST
    operator: institution
    request:
      method: GET
      url: https://wsdmoodle.waseda.jp/webservice/rest/server.php
    response:
      status: 200
      content_type: application/xml; charset=utf-8
      excerpt: |
        <EXCEPTION class="core\exception\moodle_exception">
          <ERRORCODE>invalidtoken</ERRORCODE>
          <MESSAGE>無効なトークン - …</MESSAGE>
        </EXCEPTION>
      warning: >-
        HTTP 200 with a fault body. Any check that reads the status code alone will score this as an
        open, working API. It is not — it is a token-gated endpoint reporting failure in the payload.

