      content_type: application/xml;charset=utf-8
      bytes: 14577
      excerpt: |
        <EntityDescriptor entityID="https://iaidp.ia.waseda.jp/idp/shibboleth">
          <Extensions><shibmd:Scope regexp="false">waseda.jp</shibmd:Scope></Extensions>
          <IDPSSODescriptor>
            <SingleSignOnService Binding="urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect"
              Location="https://iaidp.ia.waseda.jp/idp/profile/SAML2/Redirect/SSO"/>
            <SingleSignOnService Binding="urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST"
              Location="https://iaidp.ia.waseda.jp/idp/profile/SAML2/POST/SSO"/>
          </IDPSSODescriptor>
        </EntityDescriptor>

