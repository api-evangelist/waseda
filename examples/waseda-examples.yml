---
name: Waseda University — Captured Request / Response Examples
description: >-
  Real, credential-free request/response pairs captured from Waseda-operated and Waseda-tenant hosts
  on 2026-09-01. Nothing here is authored or illustrative — every body is a verbatim excerpt of what
  the host returned. Waseda publishes no OpenAPI, so these captures are the machine-readable record
  of what its surfaces actually answer.
generated: '2026-09-01'
method: probed
source: live probes on 2026-09-01; no credentials were used
x-operator: institution
url: https://raw.githubusercontent.com/api-evangelist/waseda/main/examples/waseda-examples.yml

examples:
  - id: iiif-presentation-manifest
    surface: Waseda IIIF Presentation API
    operator: institution
    request:
      method: GET
      url: https://iiif.archive.waseda.jp/iiif/manifest/ktnsk/ho04_02555/manifest.json
    response:
      status: 200
      content_type: application/json
      bytes: 6126
      excerpt: |
        {
          "@context": "http://iiif.io/api/presentation/2/context.json",
          "@type": "sc:Manifest",
          "@id": "https://iiif.archive.waseda.jp/iiif/manifest/ktnsk/ho04_02555/manifest.json",
          "label": "玉篇 [書写資料]. 卷第9 / [顧野王] [撰]",
          "attribution": "早稲田大学図書館 (Waseda University Library)",
          "license": "https://www.waseda.jp/library/user/using-images/",
          "sequences": [ { "canvases": [ { "@type": "sc:Canvas", "width": 88862, "height": 3000 } ] } ]
        }

  - id: iiif-image-info
    surface: Waseda IIIF Image API
    operator: institution
    request:
      method: GET
      url: https://iiif.archive.waseda.jp/iiif/image/ktnsk/ho04_02555/ho04_02555_a001/info.json
    response:
      status: 200
      content_type: application/ld+json
      excerpt: |
        {
          "@context": "http://iiif.io/api/image/2/context.json",
          "@id": "https://iiif.archive.waseda.jp/iiif/image/ktnsk/ho04_02555/ho04_02555_a001",
          "protocol": "http://iiif.io/api/image",
          "width": 88862, "height": 3000,
          "tiles": [ { "width": 256, "height": 256, "scaleFactors": [1,2,4,8,16,32,64,128,256,512] } ],
          "profile": [ "http://iiif.io/api/image/2/level1.json",
                       { "formats": ["jpg"], "qualities": ["native","color","gray"] } ]
        }
    note: >-
      The Image API request template that follows from this is
      /iiif/image/{collection}/{item}/{image}/{region}/{size}/{rotation}/{quality}.{format} —
      e.g. .../full/full/0/default.jpg, which is the URL the manifest itself references.

  - id: oai-pmh-identify
    surface: Waseda University Repository — OAI-PMH
    operator: tenant
    request:
      method: GET
      url: https://waseda.repo.nii.ac.jp/oai?verb=Identify
      headers_note: >-
        Send no User-Agent, or a non-browser one. A desktop-browser User-Agent draws 406 Not Acceptable
        from NII's nginx.
    response:
      status: 200
      content_type: text/xml; charset=utf-8
      excerpt: |
        <OAI-PMH xmlns="http://www.openarchives.org/OAI/2.0/">
          <request verb="Identify">https://waseda.repo.nii.ac.jp/oai</request>
          <Identify>
            <repositoryName>Waseda University Repository</repositoryName>
            <adminEmail>repository@list.waseda.jp</adminEmail>
            <baseURL>https://waseda.repo.nii.ac.jp/oai</baseURL>
            <protocolVersion>2.0</protocolVersion>
            <earliestDatestamp>2016-07-05T00:00:00Z</earliestDatestamp>
            <deletedRecord>transient</deletedRecord>
            <granularity>YYYY-MM-DDThh:mm:ssZ</granularity>
          </Identify>
        </OAI-PMH>

  - id: oai-pmh-listmetadataformats
    surface: Waseda University Repository — OAI-PMH
    operator: tenant
    request:
      method: GET
      url: https://waseda.repo.nii.ac.jp/oai?verb=ListMetadataFormats
    response:
      status: 200
      metadata_prefixes:
        - jpcoar_1.0
        - jpcoar
        - jpcoar_2.0
        - oai_dc
        - ddi
        - jpcoar_v1
        - lom

  - id: shibboleth-idp-metadata
